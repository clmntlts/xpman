[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpman"
version = "0.2.0"
description = "Open, dongle-free EEG/vision-science experiment runner (FPVS and other periodic-stimulation paradigms)."
readme = "README.md"
license = {text = "MIT"}
requires-python = "==3.11.*"
# PsychoPy is picky about interpreter version; 3.11 is verified (2026-07-02) to resolve and
# install cleanly for psychopy==2026.1.3 on Windows. Do not loosen without re-verifying.

dependencies = [
    "psychopy==2026.1.3",
    # Pinned to the 6.8 line: PySide6 6.11.x fails to import QtCore on the target Windows build
    # ("DLL load failed while importing QtCore: The specified procedure could not be found"), which
    # breaks the GUI and the whole test suite. 6.8.3 is verified good (2026-07-13). Do not raise the
    # ceiling without re-verifying QtCore actually imports on the lab machines.
    "pyside6>=6.8,<6.9",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.6,<3",
    "pyarrow>=17,<25",
    # Already installed transitively via PsychoPy, but declared explicitly because the serial
    # (USB virtual-COM) trigger backend imports it directly -- see hardware/trigger_serial.py.
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
xpman = "xpman.gui.app:main"

[project.entry-points."xpman.tasks"]
dummy = "xpman.tasks.dummy.task:DummyTask"
fpvs = "xpman.tasks.fpvs.task:FPVSTask"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
line-length = 100
src = ["src"]
